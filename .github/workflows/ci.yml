name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build

  supabase:
    name: Supabase local schema
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start local Supabase
        run: supabase db start
      - name: Apply migrations and seed data
        run: supabase db reset --local --yes
      - name: Lint local database
        run: supabase db lint --local --fail-on error
      - name: Run database tests
        run: supabase test db --local
      - name: Confirm migration state
        run: supabase migration list --local
      - name: Smoke-test posts schema and RLS
        shell: bash
        run: |
          result="$(supabase db query --local "select slug, (select relrowsecurity from pg_class where oid = 'public.posts'::regclass) as rls_enabled from public.posts where slug = 'fixture-post';")"
          echo "$result"
          grep -q "fixture-post" <<< "$result"
          grep -q "true" <<< "$result"
