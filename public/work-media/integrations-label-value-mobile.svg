<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" role="img" aria-labelledby="title desc">
  <title id="title">Horizontal and vertical label/value patterns</title>
  <desc id="desc">An explanatory comparison. Horizontal pairs put the label beside its value. Vertical pairs put the label above its value.</desc>
  <rect width="360" height="560" fill="#fffefc"/>
  <path d="M24 252H336" stroke="#cfcfcc"/>
  <g font-family="Inter, Arial, sans-serif">
    <g font-size="25" font-weight="600" fill="#171614">
      <text x="24" y="46">Horizontal</text>
      <text x="24" y="302">Vertical</text>
    </g>
    <g font-size="22" fill="#6b665f">
      <text x="24" y="105">Label</text>
      <text x="24" y="174">Label</text>
      <text x="24" y="355">Label</text>
      <text x="24" y="445">Label</text>
    </g>
    <g font-size="28" font-weight="550" fill="#171614">
      <text x="180" y="106">Value</text>
      <text x="180" y="175">Value</text>
      <text x="24" y="394">Value</text>
      <text x="24" y="484">Value</text>
    </g>
    <g font-size="20" fill="#b7371c">
      <text x="24" y="220">Beside the label</text>
      <text x="24" y="532">Below the label</text>
    </g>
  </g>
  <g fill="none" stroke="#cfcfcc">
    <path d="M24 127H336M24 196H336M24 411H336M24 501H336"/>
  </g>
  <g fill="none" stroke="#b7371c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M113 98H152M144 92L152 98L144 104"/>
    <path d="M123 357V385M117 377L123 385L129 377"/>
  </g>
</svg>
