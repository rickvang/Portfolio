<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" role="img" aria-labelledby="title desc">
  <title id="title">A record page and a record slide-in panel</title>
  <desc id="desc">A diagram derived from the interview. The earlier approach, as recalled, used a page refresh and drill-down. The adopted approach created or viewed a record in a slide-in panel. The shapes are abstract containers, not product screens.</desc>
  <rect width="360" height="560" fill="#fffefc"/>
  <path d="M24 267H336" stroke="#cfcfcc"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="24" y="46" font-size="23" font-weight="600" fill="#171614">Earlier (as recalled)</text>
    <text x="24" y="313" font-size="25" font-weight="600" fill="#b7371c">Adopted</text>
  </g>
  <rect x="24" y="71" width="312" height="146" rx="5" fill="#f7f6f2" stroke="#6b665f" stroke-width="1.5"/>
  <path d="M24 338H90M24 485H90" stroke="#cfcfcc" stroke-dasharray="4 5"/>
  <rect x="102" y="338" width="234" height="147" rx="5" fill="#f7f6f2" stroke="#b7371c" stroke-width="1.5"/>
  <g font-family="Inter, Arial, sans-serif" fill="#171614">
    <g font-size="29" font-weight="550">
      <text x="50" y="123">Record</text>
      <text x="50" y="161">page</text>
      <text x="126" y="391">Record</text>
      <text x="126" y="429">panel</text>
    </g>
    <g font-size="20" fill="#6b665f">
      <text x="24" y="246">Refresh + drill-down</text>
      <text x="24" y="533">Create / view in a slide-in</text>
    </g>
  </g>
</svg>
