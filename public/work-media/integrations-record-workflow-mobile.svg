    <text x="84" y="310" font-size="14" font-weight="550">Record</text>
    <text x="84" y="328" font-size="14" font-weight="550">slide-in</text>
    <text x="38" y="466" font-size="13" font-weight="550">Library</text>
    <text x="65" y="528" font-size="13" font-weight="550">Guidelines</text>
