<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" role="img" aria-labelledby="title desc">
  <title id="title">Learning from another team and sharing the pattern</title>
  <desc id="desc">A page-based record workflow, another team's slide-in pattern for creating and viewing records, and adoption of the slide-in pattern into shared Figma libraries and guidelines.</desc>
  <rect width="360" height="560" fill="#fffefc"/>
  <g font-family="Inter, Arial, sans-serif" fill="#171614">
    <g font-size="22" font-weight="600">
      <text x="24" y="40">Page-based workflow</text>
      <text x="24" y="231">Another team's pattern</text>
      <text x="24" y="423">Our shared system</text>
    </g>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <path d="M180 175V195M173 188L180 195L187 188" stroke="#6b665f"/>
    <path d="M180 364V386M173 379L180 386L187 379" stroke="#b7371c"/>
    <rect x="24" y="87" width="114" height="65" rx="4" fill="#f7f6f2" stroke="#6b665f"/>
    <path d="M39 104H98M39 115H84" stroke="#cfcfcc"/>
    <path d="M24 260H138V339H24" stroke="#cfcfcc" stroke-dasharray="4 5"/>
